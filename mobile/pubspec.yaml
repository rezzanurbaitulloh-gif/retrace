name: retrace_mobile
description: RETRACE - Device Recovery, Tracking & Security Platform
version: 1.0.0+1
publish_to: "none"
environment: { sdk: ">=3.3.0 <4.0.0" }
dependencies:
  flutter: { sdk: flutter }
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  supabase_flutter: ^2.5.0
  encrypt: ^5.0.3
